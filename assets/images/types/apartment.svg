<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- A bright apartment living room (illustration). -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6efe4"/><stop offset="1" stop-color="#ece1d0"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fc9e6"/><stop offset="1" stop-color="#f3d9b1"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c79c6c"/><stop offset="1" stop-color="#a97b4c"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6df" stop-opacity=".7"/><stop offset="1" stop-color="#fff6df" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#wall)"/>
  <!-- window -->
  <rect x="430" y="60" width="300" height="230" rx="6" fill="#d8c7ae"/>
  <rect x="442" y="72" width="276" height="206" fill="url(#sky)"/>
  <path d="M442 230 L500 190 L540 210 L600 160 L660 200 L718 175 L718 278 L442 278 Z" fill="#7f9b84" opacity=".8"/>
  <rect x="470" y="200" width="26" height="78" fill="#b9a68d"/><rect x="505" y="185" width="34" height="93" fill="#cbb89c"/><rect x="560" y="210" width="22" height="68" fill="#a8957b"/>
  <circle cx="660" cy="118" r="20" fill="#fff3d1"/>
  <rect x="578" y="72" width="6" height="206" fill="#d8c7ae"/><rect x="442" y="172" width="276" height="6" fill="#d8c7ae"/>
  <path d="M430 290 L330 500 L860 500 L730 290 Z" fill="url(#sun)"/>
  <!-- curtain -->
  <path d="M410 50 Q420 170 405 300 L425 300 Q440 170 428 50 Z" fill="#c9a77d"/>
  <rect x="400" y="44" width="350" height="8" rx="4" fill="#8b6a45"/>
  <!-- floor -->
  <rect y="360" width="800" height="140" fill="url(#floor)"/>
  <g stroke="#b88b5b" stroke-width="2" opacity=".5"><line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="445" x2="800" y2="445"/><line x1="150" y1="360" x2="120" y2="400"/><line x1="420" y1="400" x2="400" y2="445"/><line x1="650" y1="360" x2="630" y2="400"/></g>
  <!-- rug -->
  <ellipse cx="250" cy="430" rx="210" ry="38" fill="#e7d7c1"/>
  <!-- sofa -->
  <rect x="70" y="270" width="330" height="70" rx="22" fill="#2f3a3f"/>
  <rect x="55" y="300" width="360" height="72" rx="20" fill="#3c494f"/>
  <rect x="95" y="290" width="135" height="45" rx="14" fill="#4b5a61"/><rect x="240" y="290" width="135" height="45" rx="14" fill="#4b5a61"/>
  <rect x="120" y="275" width="54" height="40" rx="10" fill="#d9a35f"/><rect x="300" y="278" width="50" height="38" rx="10" fill="#e9dcc6"/>
  <rect x="80" y="370" width="10" height="20" fill="#2b2420"/><rect x="380" y="370" width="10" height="20" fill="#2b2420"/>
  <!-- coffee table -->
  <ellipse cx="240" cy="415" rx="80" ry="14" fill="#6b4c32"/><rect x="232" y="415" width="16" height="22" fill="#5a3f2a"/>
  <circle cx="215" cy="406" r="9" fill="#fff"/><rect x="250" y="398" width="34" height="8" rx="2" fill="#c45d3c"/>
  <!-- lamp -->
  <rect x="38" y="160" width="4" height="200" fill="#2b2420"/><path d="M14 160 L66 160 L56 120 L24 120 Z" fill="#e7c48d"/><ellipse cx="40" cy="362" rx="22" ry="6" fill="#2b2420"/>
  <!-- plant -->
  <path d="M760 360 L780 360 L776 400 L764 400 Z" fill="#b3653c" transform="translate(-30 0)"/>
  <g fill="#5f8a5b"><ellipse cx="738" cy="320" rx="14" ry="36" transform="rotate(-25 738 320)"/><ellipse cx="752" cy="315" rx="12" ry="40"/><ellipse cx="766" cy="325" rx="13" ry="34" transform="rotate(28 766 325)"/></g>
  <!-- frames -->
  <rect x="120" y="110" width="90" height="110" rx="4" fill="#fff" stroke="#8b6a45" stroke-width="5"/><path d="M130 200 L160 150 L180 180 L200 160 L200 210 L130 210 Z" fill="#d9a35f" opacity=".8"/>
  <rect x="230" y="135" width="70" height="70" rx="4" fill="#fff" stroke="#8b6a45" stroke-width="5"/><circle cx="265" cy="170" r="18" fill="#7f9b84"/>
</svg>
