<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- A surveyed plot of land, ready to build (illustration). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fbfe0"/><stop offset="1" stop-color="#eef3e8"/></linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6cf8f"/><stop offset="1" stop-color="#86a865"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="130" cy="90" r="34" fill="#fff4d6"/>
  <path d="M0 250 Q140 170 300 230 Q420 150 560 220 Q680 170 800 220 L800 500 L0 500 Z" fill="#9db89a" opacity=".7"/>
  <path d="M0 290 Q200 250 400 280 T800 270 L800 500 L0 500 Z" fill="url(#field)"/>
  <!-- the plot -->
  <path d="M190 330 L610 310 L700 460 L110 470 Z" fill="#c9b27f" opacity=".55"/>
  <path d="M190 330 L610 310 L700 460 L110 470 Z" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="14 10"/>
  <!-- pegs -->
  <g><rect x="186" y="312" width="8" height="22" fill="#c45d3c"/><rect x="606" y="292" width="8" height="22" fill="#c45d3c"/><rect x="696" y="440" width="8" height="24" fill="#c45d3c"/><rect x="106" y="448" width="8" height="24" fill="#c45d3c"/></g>
  <!-- sign -->
  <rect x="396" y="340" width="8" height="70" fill="#6b4c32"/>
  <rect x="340" y="320" width="120" height="44" rx="6" fill="#f6efe4" stroke="#6b4c32" stroke-width="4"/>
  <g fill="#6b4c32"><rect x="356" y="333" width="88" height="6" rx="3"/><rect x="370" y="346" width="60" height="6" rx="3"/></g>
  <!-- trees and road -->
  <g><rect x="676" y="230" width="10" height="60" fill="#6b4c32"/><circle cx="681" cy="220" r="30" fill="#4f7a41"/><rect x="720" y="245" width="8" height="45" fill="#6b4c32"/><circle cx="724" cy="236" r="22" fill="#5d8a4d"/></g>
  <g><rect x="60" y="250" width="8" height="45" fill="#6b4c32"/><circle cx="64" cy="240" r="24" fill="#5d8a4d"/></g>
  <path d="M0 480 L800 470 L800 500 L0 500 Z" fill="#a89276"/>
</svg>
