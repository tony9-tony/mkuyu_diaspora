  <g><rect x="330" y="290" width="74" height="64" rx="4" fill="#f6efe4" stroke="#9a6b3f" stroke-width="5"/><rect x="335" y="295" width="64" height="54" fill="#ffd59a"/><line x1="367" y1="295" x2="367" y2="349" stroke="#9a6b3f" stroke-width="4"/></g>
  <g><rect x="516" y="290" width="74" height="64" rx="4" fill="#f6efe4" stroke="#9a6b3f" stroke-width="5"/><rect x="521" y="295" width="64" height="54" fill="#ffd59a"/><line x1="553" y1="295" x2="553" y2="349" stroke="#9a6b3f" stroke-width="4"/></g>
  <circle cx="460" cy="222" r="18" fill="#ffd59a" stroke="#9a6b3f" stroke-width="5"/>
  <path d="M430 420 L490 420 L530 600 L390 600 Z" fill="#e3cfae"/>
  <g fill="#5d8a4d"><ellipse cx="330" cy="425" rx="46" ry="18"/><ellipse cx="590" cy="425" rx="46" ry="18"/></g>
  <rect x="680" y="300" width="14" height="120" fill="#6b4c32"/><circle cx="687" cy="282" r="52" fill="#5d8a4d"/><circle cx="660" cy="300" r="32" fill="#6f9a5a"/>
