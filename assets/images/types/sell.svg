<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Selling with MKUYU: a home, its sign and the keys handed over (illustration). -->
  <defs>
