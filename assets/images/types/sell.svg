    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fbf80"/><stop offset="1" stop-color="#7a9e5e"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf5ea"/><stop offset="1" stop-color="#ecdfca"/></linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1d08a"/><stop offset="1" stop-color="#c8963f"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="610" cy="130" r="56" fill="#fff4dc"/>
  <g fill="#fff" opacity=".8"><ellipse cx="170" cy="110" rx="70" ry="16"/><ellipse cx="215" cy="98" rx="44" ry="14"/></g>
  <path d="M0 360 Q200 320 400 350 T800 340 L800 600 L0 600 Z" fill="#b7cf98"/>
  <rect y="400" width="800" height="200" fill="url(#grass)"/>
