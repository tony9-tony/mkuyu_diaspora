<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- A ground-floor shop and office space (illustration). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9cde6"/><stop offset="1" stop-color="#eaf1ee"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9ecf3"/><stop offset=".5" stop-color="#a9cfe0"/><stop offset="1" stop-color="#cfe6ef"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- building above -->
  <rect x="60" y="40" width="680" height="190" fill="#e9ddcb"/>
  <g fill="#b8d3e2" stroke="#cbb89c" stroke-width="4"><rect x="100" y="70" width="90" height="60"/><rect x="230" y="70" width="90" height="60"/><rect x="360" y="70" width="90" height="60"/><rect x="490" y="70" width="90" height="60"/><rect x="620" y="70" width="90" height="60"/><rect x="100" y="150" width="90" height="60"/><rect x="230" y="150" width="90" height="60"/><rect x="360" y="150" width="90" height="60"/><rect x="490" y="150" width="90" height="60"/><rect x="620" y="150" width="90" height="60"/></g>
  <!-- shop band -->
  <rect x="40" y="230" width="720" height="22" fill="#2b2420"/>
  <rect x="60" y="252" width="680" height="168" fill="#3b3330"/>
  <!-- awnings -->
  <g><path d="M70 262 L380 262 L395 300 L55 300 Z" fill="#b98d5f"/><g fill="#e9c58f"><path d="M110 262 L150 262 L150 300 L105 300 Z"/><path d="M190 262 L230 262 L235 300 L190 300 Z"/><path d="M270 262 L310 262 L318 300 L275 300 Z"/><path d="M350 262 L380 262 L395 300 L358 300 Z"/></g></g>
  <g><path d="M420 262 L730 262 L745 300 L405 300 Z" fill="#b98d5f"/><g fill="#e9c58f"><path d="M460 262 L500 262 L500 300 L455 300 Z"/><path d="M540 262 L580 262 L585 300 L540 300 Z"/><path d="M620 262 L660 262 L668 300 L625 300 Z"/><path d="M700 262 L730 262 L745 300 L708 300 Z"/></g></g>
  <!-- shop fronts -->
  <rect x="80" y="305" width="290" height="115" fill="url(#glass)"/><rect x="430" y="305" width="290" height="115" fill="url(#glass)"/>
  <g stroke="#3b3330" stroke-width="5"><line x1="225" y1="305" x2="225" y2="420"/><line x1="575" y1="305" x2="575" y2="420"/></g>
  <g fill="#fff" opacity=".55"><path d="M95 410 L150 315 L170 315 L115 410 Z"/><path d="M445 410 L500 315 L520 315 L465 410 Z"/></g>
