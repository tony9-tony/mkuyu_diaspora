  <rect x="250" y="370" width="100" height="50" fill="#b98d5f"/><rect x="600" y="360" width="100" height="10" fill="#7a5a3d"/><rect x="600" y="385" width="100" height="10" fill="#7a5a3d"/>
  <g fill="#d9a35f"><rect x="608" y="342" width="14" height="18"/><rect x="630" y="346" width="12" height="14"/><rect x="650" y="340" width="16" height="20"/><rect x="612" y="369" width="16" height="16"/><rect x="640" y="371" width="12" height="14"/></g>
  <circle cx="120" cy="360" r="20" fill="#5f8a5b"/><rect x="112" y="378" width="16" height="30" fill="#7a5a3d"/>
  <!-- pavement -->
  <rect x="0" y="420" width="800" height="80" fill="#cdbfa9"/>
  <g stroke="#b9aa92" stroke-width="2"><line x1="0" y1="450" x2="800" y2="450"/><line x1="100" y1="420" x2="90" y2="500"/><line x1="300" y1="420" x2="295" y2="500"/><line x1="500" y1="420" x2="505" y2="500"/><line x1="700" y1="420" x2="710" y2="500"/></g>
