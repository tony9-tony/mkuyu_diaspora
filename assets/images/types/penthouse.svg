<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- A penthouse terrace above the city at dusk (illustration). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3557"/><stop offset=".55" stop-color="#8a6a8c"/><stop offset="1" stop-color="#f0a86e"/></linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98d5f"/><stop offset="1" stop-color="#8f6640"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <g fill="#fff" opacity=".8"><circle cx="120" cy="60" r="1.6"/><circle cx="260" cy="40" r="1.4"/><circle cx="420" cy="70" r="1.6"/><circle cx="600" cy="50" r="1.4"/><circle cx="720" cy="90" r="1.6"/></g>
  <circle cx="640" cy="130" r="22" fill="#fbe7c4"/>
  <!-- skyline -->
  <g fill="#3a3550"><rect x="0" y="250" width="60" height="120"/><rect x="70" y="210" width="50" height="160"/><rect x="130" y="270" width="70" height="100"/><rect x="210" y="190" width="45" height="180"/><rect x="265" y="240" width="80" height="130"/><rect x="460" y="220" width="55" height="150"/><rect x="525" y="180" width="40" height="190"/><rect x="575" y="250" width="90" height="120"/><rect x="675" y="205" width="55" height="165"/><rect x="740" y="260" width="60" height="110"/></g>
  <g fill="#f6c97f" opacity=".85"><rect x="80" y="225" width="8" height="8"/><rect x="100" y="250" width="8" height="8"/><rect x="220" y="210" width="8" height="8"/><rect x="235" y="240" width="8" height="8"/><rect x="535" y="200" width="8" height="8"/><rect x="545" y="240" width="8" height="8"/><rect x="690" y="225" width="8" height="8"/><rect x="705" y="260" width="8" height="8"/><rect x="290" y="260" width="8" height="8"/><rect x="600" y="270" width="8" height="8"/></g>
  <!-- terrace -->
  <rect x="0" y="370" width="800" height="130" fill="url(#deck)"/>
  <g stroke="#a07648" stroke-width="2" opacity=".6"><line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="440" x2="800" y2="440"/></g>
  <rect x="0" y="330" width="800" height="40" fill="#cfe3ef" opacity=".25"/><rect x="0" y="328" width="800" height="5" fill="#d9d4cc"/>
  <g fill="#d9d4cc"><rect x="100" y="333" width="4" height="37"/><rect x="300" y="333" width="4" height="37"/><rect x="500" y="333" width="4" height="37"/><rect x="700" y="333" width="4" height="37"/></g>
  <!-- seating -->
  <rect x="130" y="395" width="230" height="40" rx="14" fill="#f2ece2"/><rect x="130" y="372" width="230" height="30" rx="12" fill="#e5ddd0"/>
  <rect x="150" y="378" width="40" height="26" rx="8" fill="#d9a35f"/><rect x="300" y="378" width="40" height="26" rx="8" fill="#7f9b84"/>
  <ellipse cx="460" cy="430" rx="50" ry="12" fill="#3b3330"/><rect x="455" y="430" width="10" height="24" fill="#2b2420"/>
  <circle cx="450" cy="422" r="6" fill="#fff"/><rect x="465" y="414" width="6" height="14" fill="#c45d3c"/>
  <!-- string lights -->
  <path d="M0 300 Q200 340 400 300 T800 300" stroke="#2b2420" stroke-width="1.5" fill="none" opacity=".6"/>
  <g fill="#ffe2a3"><circle cx="80" cy="316" r="4"/><circle cx="170" cy="326" r="4"/><circle cx="260" cy="323" r="4"/><circle cx="350" cy="309" r="4"/><circle cx="450" cy="303" r="4"/><circle cx="540" cy="313" r="4"/><circle cx="630" cy="322" r="4"/><circle cx="720" cy="313" r="4"/></g>
  <!-- plants -->
  <rect x="640" y="400" width="50" height="50" rx="4" fill="#3b3330"/><g fill="#5f8a5b"><ellipse cx="652" cy="380" rx="12" ry="30" transform="rotate(-20 652 380)"/><ellipse cx="665" cy="372" rx="11" ry="34"/><ellipse cx="678" cy="382" rx="12" ry="28" transform="rotate(22 678 382)"/></g>
</svg>
