<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- A modern villa with a pool at sunset (illustration). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1a46b"/><stop offset=".55" stop-color="#f7d29b"/><stop offset="1" stop-color="#fbe9cc"/></linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6cc3d6"/><stop offset="1" stop-color="#2f8ea8"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd59a"/><stop offset="1" stop-color="#e9a45a"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="610" cy="200" r="60" fill="#fff0cf" opacity=".9"/>
  <path d="M0 300 Q160 270 320 295 T800 285 L800 500 L0 500 Z" fill="#b9a27f" opacity=".5"/>
  <!-- palms -->
  <g><path d="M118 340 Q112 240 126 170" stroke="#6b4c32" stroke-width="10" fill="none"/><g fill="#4f7a41"><path d="M126 170 Q80 150 50 175 Q90 165 126 175Z"/><path d="M126 170 Q170 140 210 160 Q165 160 126 176Z"/><path d="M126 170 Q110 120 70 115 Q105 135 124 172Z"/><path d="M126 170 Q150 120 190 110 Q155 135 128 172Z"/></g></g>
  <!-- villa -->
  <rect x="210" y="170" width="420" height="16" fill="#3b3330"/>
  <rect x="230" y="186" width="380" height="80" fill="#f4ede2"/>
  <rect x="250" y="196" width="160" height="60" fill="url(#glass)" stroke="#3b3330" stroke-width="4"/><line x1="330" y1="196" x2="330" y2="256" stroke="#3b3330" stroke-width="3"/>
  <rect x="440" y="196" width="150" height="60" fill="#d7c4a8"/>
  <rect x="180" y="266" width="480" height="14" fill="#3b3330"/>
  <rect x="200" y="280" width="450" height="80" fill="#efe5d6"/>
  <rect x="220" y="292" width="250" height="68" fill="url(#glass)" stroke="#3b3330" stroke-width="4"/><g stroke="#3b3330" stroke-width="3"><line x1="282" y1="292" x2="282" y2="360"/><line x1="345" y1="292" x2="345" y2="360"/><line x1="408" y1="292" x2="408" y2="360"/></g>
  <rect x="490" y="292" width="140" height="68" fill="#b98d5f"/><g stroke="#a07648" stroke-width="2"><line x1="490" y1="306" x2="630" y2="306"/><line x1="490" y1="320" x2="630" y2="320"/><line x1="490" y1="334" x2="630" y2="334"/><line x1="490" y1="348" x2="630" y2="348"/></g>
