  <rect x="0" y="360" width="800" height="140" fill="#d8c3a1"/>
  <path d="M170 390 L640 390 L700 470 L110 470 Z" fill="url(#pool)"/>
  <g stroke="#bfe9f2" stroke-width="3" opacity=".7" fill="none"><path d="M210 415 q20 -6 40 0 t40 0"/><path d="M420 440 q20 -6 40 0 t40 0"/><path d="M300 455 q20 -6 40 0 t40 0"/></g>
