<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My portal · MKUYU Diaspora Portal</title>
  <meta name="description" content="Your MKUYU Africa customer portal: requests, contracts, payments and documents in one place." />
  <meta name="theme-color" content="#16130f" />
  <meta property="og:title" content="My portal · MKUYU Diaspora Portal" />
  <meta property="og:description" content="Your MKUYU Africa customer portal: requests, contracts, payments and documents in one place." />
  <meta property="og:type" content="website" />
  <script>
    document.documentElement.classList.add("js");
    // Opened straight from disk (file://), browsers block the site's modules.
    // Say so plainly instead of showing a half-working page.
    if (location.protocol === "file:") document.addEventListener("DOMContentLoaded", function () {
      document.documentElement.classList.remove("js");
      var note = document.createElement("div");
      note.setAttribute("role", "alert");
      note.style.cssText = "position:fixed;inset:auto 1rem 1rem;z-index:9999;max-width:560px;margin:auto;padding:1.1rem 1.3rem;border-radius:14px;background:#16130f;color:#efe9e0;font:15px/1.55 system-ui,sans-serif;box-shadow:0 20px 50px rgba(0,0,0,.35)";
      note.innerHTML = "<strong style='color:#dcc3a0'>This page was opened from a file, so it cannot run.</strong><br>Close it and double-click <b>Open MKUYU site.cmd</b> in the mkuyu_ui folder, or run <code>node serve.mjs</code> and open <b>http://localhost:5500</b>.";
      document.body.appendChild(note);
    });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/images/brand/favicon-64.png" />
  <link rel="apple-touch-icon" href="assets/images/brand/mkuyu-logo-192.png" />
  <meta property="og:image" content="assets/images/brand/mkuyu-logo.png" />
  <script type="module" src="assets/js/app.js"></script>
  <style>@view-transition { navigation: none; }</style>
</head>
<body data-page="portal" class="is-portal">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header portal-header">
    <div class="wrap header-inner">
      <a class="brand" href="portal.html#overview" aria-label="MKUYU Diaspora Portal, overview">
        <img class="logo" src="assets/images/brand/mkuyu-logo-192.png" alt="" width="46" height="46" />
        <span class="brand-text"><span class="brand-name">MKUYU AFRICA</span><span class="brand-sub">Diaspora Portal</span></span>
      </a>
      <div class="portal-title" data-portal-title aria-live="polite"></div>
      <div class="header-cta portal-header-user" data-portal-user></div>
    </div>
  </header>

  <main id="main">
    <section class="section portal-section">
      <div class="wrap">
        <div id="portal-host" aria-live="polite"></div>
        <noscript><p class="notice"><strong>Note:</strong>&nbsp;the customer portal needs JavaScript.</p></noscript>
      </div>
    </section>
  </main>

  <footer class="portal-footer">
    <div class="wrap">
      <span>© <span data-year>2026</span> MKUYU Africa · Dar es Salaam, Tanzania</span>
      <span>Your information is private: only you and the MKUYU team serving you can see it.</span>
    </div>
  </footer>
</body>
</html>
